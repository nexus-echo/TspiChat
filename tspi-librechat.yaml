version: 1.3.15

cache: true

# TSPI Digital — clinician chat for TSPI Brain.
# Day 1: WorkOS login, per-user token passthrough to the TSPI MCP, one locked clinical model spec.
# Day 2: clinician UI lock-down, treatment-plan Skill (skill/tspi-treatment-plan), terms of use.

interface:
  # UI-only flags below apply to everyone; admins get modelSelect/parameters/presets back through
  # an ADMIN role config override in the admin panel (admin.tspipro.com).
  #
  # Role PERMISSIONS (prompts, memories, agents, skills, mcpServers, multiConvo, peoplePicker) are
  # deliberately NOT set here: anything set here is re-applied to BOTH the USER and ADMIN roles on
  # every restart, which would also lock admins out. They are set per role instead, see
  # docs/tspi-day2-roles.md (USER = clinician view, ADMIN = everything).
  customWelcome: 'Welcome to TSPI Digital. Start a new case with a case code, age band, sex, symptoms and labs. Never enter patient names or identifiers.'
  modelSelect: false
  parameters: false
  presets: false
  bookmarks: true
  marketplace:
    use: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  fileSearch: true
  fileCitations: true
  webSearch: true
  runCode: true
  temporaryChat: true
  feedback: true
  defaultPinnedTools:
    - 'web_search'
    - 'execute_code'
    - 'mcp'
  termsOfService:
    modalAcceptance: true
    modalTitle: 'TSPI Digital: terms of use'
    modalContent: |
      # Terms of use for TSPI Digital

      TSPI Digital is a clinical decision-support tool for licensed clinicians. By continuing you confirm that:

      1. **AI drafts are not prescriptions.** Every treatment plan generated by TSPI AI Brain is an AI draft. It must be reviewed and approved by the treating physician before any patient use. Clinical decisions remain your responsibility.
      2. **De-identified data only.** You will not enter patient names, dates of birth, medical record numbers, contact details or other direct identifiers. Use a case code.
      3. **Patient consent.** You have the patient's consent for AI-assisted analysis of their de-identified data.
      4. **Accountability.** Approvals, edits and rejections are recorded in the TSPI audit log under your account.
      5. **Emergencies.** TSPI Digital is not for emergencies. Act on red flags and critical values through your clinical protocols.

webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none

mcpServers:
  tspi:
    title: TSPI Brain
    description: TSPI AI Brain clinical decision support (de-identified cases only)
    type: streamable-http
    url: https://mcp.tspipro.com/mcp
    headers:
      # Each clinician's own WorkOS access token (requires OPENID_REUSE_TOKENS=true).
      Authorization: 'Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}'
    serverInstructions: true # pulls the server's de-identification rules into the prompt
    chatMenu: false # clinicians cannot switch it off
    startup: false # no app-level connection: every connection is per user, with their token
    timeout: 120000

endpoints:
  # Production target (not used on staging yet): switch the spec preset back to
  # `endpoint: anthropic`, `model: claude-sonnet-5-5` and set ENDPOINTS=agents,anthropic.
  anthropic:
    models:
      - claude-sonnet-5-5
      - claude-haiku-4-5-20251001
    titleConvo: true
    titleModel: claude-haiku-4-5-20251001
  # Staging model: DeepSeek (OpenAI-compatible API). Key stays server-side in DEEPSEEK_API_KEY.
  custom:
    - name: DeepSeek
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default:
          - deepseek-v4-pro
          - deepseek-flash
        fetch: false
      titleConvo: true
      titleModel: deepseek-flash
      modelDisplayLabel: DeepSeek

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: tspi-clinical
      label: TSPI Clinical Assistant
      description: Analyse de-identified cases and draft TSPI treatment plans for physician review
      default: true
      mcpServers:
        - tspi
      webSearch: true
      executeCode: true
      skills:
        - tspi-treatment-plan
      conversation_starters:
        - Analyse a new case
        - Continue a draft treatment plan
        - Record a follow-up outcome
      preset:
        endpoint: DeepSeek # staging; production: anthropic / claude-sonnet-5-5
        model: deepseek-v4-pro
        promptPrefix: |
          You are TSPI Digital, a clinical assistant for licensed clinicians using the TSPI AI Brain.
          - Collect only de-identified data: a case code, age band, sex, symptoms, labs with units,
            medications and conditions. Never ask for or submit a name, date of birth, MRN, phone,
            email or address. If the clinician types one, do not repeat it and ask for a case code.
          - For a new case, always run tspi_screen_red_flags first, then continue only if the
            clinician wants to proceed.
          - The TSPI engine is the only source of clinical conclusions. Present its output as-is and
            never invent or estimate scores, networks, modules, doses, evidence grades or outcomes.
          - After a plan is generated, compare the labs you submitted with the engine's returned
            signals and list any lab the engine did not use before asking for approval.
          - A generated plan is an AI draft. Never call tspi_approve_treatment_plan unless the
            clinician has explicitly asked to approve that specific report_id in this conversation.
          - Keep case details out of web searches; search only for general medical literature.
